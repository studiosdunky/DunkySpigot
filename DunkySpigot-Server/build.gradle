plugins { id 'com.github.johnrengelman.shadow' }

// Upstream includes a Java 8 compatibility shim in sun.reflect.
// Compile and resolve runtime dependencies for Java 8.
configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 8)
}

configurations {
    minecraftServer
    remapper
}
tasks.withType(JavaCompile).configureEach {
    // Updated libraries must precede their old copies bundled in Minecraft.
    classpath = classpath + configurations.minecraftServer
}
tasks.withType(Test).configureEach {
    classpath = classpath + configurations.minecraftServer
}

dependencies {
    implementation project(':DunkySpigot-API')
    implementation 'io.netty:netty-all:4.1.132.Final'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'it.unimi.dsi:fastutil:8.5.6'
    implementation 'net.sf.jopt-simple:jopt-simple:3.2'
    implementation 'jline:jline:2.12.1'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.7.2'
    runtimeOnly 'mysql:mysql-connector-java:5.1.14'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.mockito:mockito-core:1.10.19'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    implementation 'com.eatthepath:fast-uuid:0.2.0'
    implementation 'com.velocitypowered:velocity-native:1.1.0'
    implementation 'net.openhft:affinity:3.21ea83'
    implementation 'com.github.matejtymes:javafixes:1.3.6.1'
    implementation 'org.checkerframework:checker-qual:3.21.0'
    implementation 'net.kyori:adventure-key:4.10.1'
    minecraftServer 'org.spigotmc:minecraft-server:1.8.8-SNAPSHOT'
    remapper 'net.md-5:SpecialSource:1.11.4'
}

// Keep the updated dependency versions ahead of Minecraft's bundled libraries.
def minecraftRuntimeJar = tasks.register('minecraftRuntimeJar', Jar) {
    dependsOn tasks.named('classes'), project(':DunkySpigot-API').tasks.named('classes')
    archiveFileName.set('minecraft-runtime.jar')
    destinationDirectory.set(layout.buildDirectory.dir('minecraft'))
    from({ configurations.minecraftServer.collect { zipTree(it) } })
    // Minecraft also bundles older copies of the classes rebuilt by our modules.
    def replacedEntries = providers.provider {
        def outputs = sourceSets.main.output.files +
                project(':DunkySpigot-API').sourceSets.main.output.files
        def names = new HashSet<String>()
        outputs.each { directory ->
            fileTree(directory).matching { include '**/*' }.visit { entry ->
                if (!entry.directory) names.add(entry.relativePath.pathString)
            }
        }
        names
    }
    inputs.files(sourceSets.main.output,
            project(':DunkySpigot-API').sourceSets.main.output)
    Set<String> replacedEntryNames = null
    doFirst { replacedEntryNames = replacedEntries.get() }
    exclude { entry ->
        if (replacedEntryNames == null) replacedEntryNames = replacedEntries.get()
        replacedEntryNames.contains(entry.path)
    }
    exclude 'org/apache/logging/log4j/**', 'io/netty/**', 'com/google/common/**',
            'com/google/gson/**', 'org/apache/commons/lang3/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

shadowJar {
    dependsOn minecraftRuntimeJar
    archiveFileName.set('DunkySpigot-shadow.jar')
    mergeServiceFiles()
    from({ zipTree(minecraftRuntimeJar.get().archiveFile.get().asFile) })
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    manifest {
        attributes 'Main-Class': 'org.bukkit.craftbukkit.Main',
                'Implementation-Title': 'DunkySpigot',
                'Implementation-Version': project.version,
                'Specification-Title': 'Bukkit',
                'Specification-Version': '1.8.8-R0.1-SNAPSHOT',
                'Specification-Vendor': 'Bukkit Team',
                'Multi-Release': 'true'
    }
    relocate 'joptsimple', 'org.bukkit.craftbukkit.libs.joptsimple'
    relocate 'jline', 'org.bukkit.craftbukkit.libs.jline'
    relocate 'org.ibex', 'org.bukkit.craftbukkit.libs.org.ibex'
    relocate 'org.gjt', 'org.bukkit.craftbukkit.libs.org.gjt'
    relocate('org.bukkit.craftbukkit', 'org.bukkit.craftbukkit.v1_8_R3') {
        exclude 'org.bukkit.craftbukkit.Main*'
    }
    relocate 'com.github.benmanes.caffeine', 'org.bukkit.craftbukkit.libs.caffeine'
    relocate 'javassist', 'org.bukkit.craftbukkit.libs.javassist'
    relocate 'net.minecraft.server', 'net.minecraft.server.v1_8_R3'
}

// The upstream Maven build applies these mappings after shading.
def serverJar = layout.buildDirectory.file('libs/DunkySpigot.jar')
tasks.register('remapJar', JavaExec) {
    dependsOn shadowJar
    classpath = configurations.remapper
    mainClass.set('net.md_5.specialsource.SpecialSource')
    javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
    inputs.file(shadowJar.archiveFile)
    inputs.files('deprecation-mappings.csrg', 'deprecation-mappings.at')
    outputs.file(serverJar)
    doFirst {
        args = ['--in-jar', shadowJar.archiveFile.get().asFile.absolutePath,
                '--out-jar', serverJar.get().asFile.absolutePath,
                '--srg-in', file('deprecation-mappings.csrg').absolutePath,
                '--access-transformer', file('deprecation-mappings.at').absolutePath]
    }
}
jar { archiveFileName.set('DunkySpigot-unshaded.jar') }
sourcesJar { archiveFileName.set('DunkySpigot-sources.jar') }
tasks.named('assemble') { dependsOn 'remapJar' }
test {
    workingDir = layout.buildDirectory.dir('test-server').get().asFile
    doFirst { workingDir.mkdirs() }
    exclude 'org/bukkit/craftbukkit/inventory/ItemStack*Test.class'
}

// Catch resource collisions that otherwise hide server logs after startup.
tasks.register('verifyRuntimeJar') {
    dependsOn 'remapJar'
    inputs.file(serverJar)
    inputs.file('src/main/resources/log4j2.xml')
    doLast {
        new java.util.jar.JarFile(serverJar.get().asFile).withCloseable { jar ->
            def entry = jar.getJarEntry('log4j2.xml')
            if (entry == null) throw new GradleException('Runtime logging configuration missing')
            def packaged = jar.getInputStream(entry).withCloseable { it.bytes }
            if (!java.util.Arrays.equals(packaged, file('src/main/resources/log4j2.xml').bytes)) {
                throw new GradleException('Minecraft replaced the server logging configuration')
            }
            jar.entries().each { candidate ->
                if (candidate.name.endsWith('.class') && !candidate.name.startsWith('META-INF/versions/')
                        && !candidate.name.endsWith('module-info.class')) {
                    jar.getInputStream(candidate).withCloseable { stream ->
                        def header = new DataInputStream(stream)
                        header.readInt()
                        header.readUnsignedShort()
                        def major = header.readUnsignedShort()
                        if (major > 52) throw new GradleException("Java 8 incompatible class: ${candidate.name} (major ${major})")
                    }
                }
            }
            if (jar.getJarEntry('net/minecraft/server/v1_8_R3/MinecraftServer.class') == null) {
                throw new GradleException('Runtime NMS mapping is missing')
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyRuntimeJar' }
