plugins { id 'com.github.johnrengelman.shadow' }

dependencies {
    compileOnly 'it.unimi.dsi:fastutil:8.5.6'
    api 'commons-lang:commons-lang:2.6'
    api 'com.googlecode.json-simple:json-simple:1.1.1'
    api 'com.google.guava:guava:17.0'
    api 'com.google.code.gson:gson:2.8.9'
    api 'org.avaje:ebean:2.8.1'
    api 'org.yaml:snakeyaml:1.15'
    api 'net.md-5:bungeecord-chat:1.8-SNAPSHOT'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
}

jar { archiveFileName.set('DunkySpigot-API.jar') }
shadowJar { archiveFileName.set('DunkySpigot-API-all.jar') }
sourcesJar { archiveFileName.set('DunkySpigot-API-sources.jar') }
