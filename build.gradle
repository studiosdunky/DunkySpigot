plugins {
    id 'base'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

allprojects {
    group = 'net.dunky.spigot'
    version = '1.0.0'
    repositories {
        mavenCentral()
        maven { url = 'https://maven.elmakers.com/repository/' }
        maven { url = 'https://repo.hpfxd.com/releases/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        withSourcesJar()
    }
    // Bukkit 1.8 uses MapMaker.softValues(), removed in newer Guava versions.
    configurations.configureEach {
        if (name != 'remapper') resolutionStrategy.force 'com.google.guava:guava:17.0'
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-options'
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.withType(Test).configureEach {
        useJUnit()
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
    }
}

ext.dunkySourceDirectories = [file('DunkySpigot-API/src/main'), file('DunkySpigot-Server/src/main')]
ext.dunkyTrackedFiles = [file('build.gradle'), file('settings.gradle'), file('DunkySpigot-API/build.gradle'), file('DunkySpigot-Server/build.gradle')]
ext.dunkyArtifactTask = 'build'
ext.dunkyArtifactFile = file('DunkySpigot-Server/build/libs/DunkySpigot.jar')
def versioning = file('../DunkyUpdater/versionamento.gradle')
apply from: versioning.isFile() ? versioning : file('gradle/versionamento.gradle')
subprojects { version = rootProject.version }

tasks.named('assemble') {
    dependsOn ':DunkySpigot-API:assemble', ':DunkySpigot-Server:assemble'
}
tasks.named('check') {
    dependsOn ':DunkySpigot-API:check', ':DunkySpigot-Server:check'
}

// The local network uses one runtime JAR per game server.
def localServers = file('../../../servers')
def gameServers = ['lobby', 'bridge', 'bedwars']
def runtimeJar = project(':DunkySpigot-Server').layout.buildDirectory.file('libs/DunkySpigot.jar')
tasks.register('copyToServers') {
    dependsOn ':DunkySpigot-Server:remapJar', tasks.named('check')
    inputs.file(runtimeJar)
    outputs.files(gameServers.collect { new File(localServers, "${it}/DunkySpigot.jar") })
    onlyIf { localServers.isDirectory() }
    doLast {
        gameServers.each { server ->
            def destination = new File(localServers, server)
            if (!destination.isDirectory()) throw new GradleException("Local server directory missing: ${destination}")
            copy {
                from runtimeJar
                into destination
            }
        }
    }
}
tasks.named('build') { dependsOn 'copyToServers' }
